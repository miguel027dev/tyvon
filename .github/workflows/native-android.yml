name: Native Android prototype
on:
  push:
    branches:
      - feat/tyvon-iron-native-foundation-20261008
    paths:
      - 'android-native/**'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Print lint diagnostics
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: TYVON-native-prototype-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
