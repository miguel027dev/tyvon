name: Native Android prototype
on:
  push:
    branches:
      - feat/tyvon-iron-native-foundation-20261008
    paths:
      - 'android-native/**'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TYVON-native-prototype-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
