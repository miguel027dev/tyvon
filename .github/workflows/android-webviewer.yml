name: TYVON Android WebViewer APK

on:
  push:
    branches:
      - main
      - feat/webviewer-android-feel-20261008
    paths:
      - 'android-app/**'
      - '.github/workflows/android-webviewer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile signed debug APK and check Android lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Show lint diagnostics on failure
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Upload installable Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: TYVON-WebViewer-1.2.0-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
